services:
  postgres:
    image: postgres:16-alpine
    container_name: scalevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalevault}
      POSTGRES_USER: ${DATABASE_USERNAME:-scalevault_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-scalevault_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scalevault-network

  redis:
    image: redis:7-alpine
    container_name: scalevault-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scalevault-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  scalevault-network:
    driver: bridge
